<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17121b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="For You">
  <title>For You</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <section id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-mark" aria-hidden="true">FY</div>
      <h1>For You</h1>
      <p class="muted">A little place, just for us.</p>
      <form id="unlock-form" class="lock-form">
        <label for="pin">PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" spellcheck="false" required>
        <button type="submit" class="primary">Unlock</button>
      </form>
      <p id="lock-error" class="error" role="alert"></p>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <header class="app-header">
      <div>
        <p id="header-date" class="eyebrow"></p>
        <h1 id="header-title">For You</h1>
      </div>
      <button id="lock-button" type="button" class="ghost small">Lock</button>
    </header>

    <main id="main-content">
      <section id="view-envelopes" class="view">
        <div class="view-head">
          <h2>Open When...</h2>
          <p class="muted">Letters for whatever today feels like.</p>
        </div>
        <div id="envelopes-list" class="card-grid"></div>
      </section>

      <section id="view-memories" class="view" hidden>
        <div class="view-head">
          <h2>Memory Wall</h2>
          <p class="muted">Little moments worth keeping.</p>
        </div>
        <div id="memories-list" class="card-grid"></div>
      </section>

      <section id="view-vouchers" class="view" hidden>
        <div class="view-head">
          <h2>Care Vouchers</h2>
          <p class="muted">Tap to redeem when you need one.</p>
        </div>
        <div id="vouchers-list" class="card-grid"></div>
      </section>

      <section id="view-distance" class="view" hidden>
        <div class="view-head">
          <h2>Our Distance</h2>
          <p class="muted">Closer every day.</p>
        </div>
        <div id="distance-content"></div>
      </section>

      <section id="view-admin" class="view" hidden>
        <div class="view-head">
          <h2>Admin Studio</h2>
          <p class="muted">Add something new without touching code.</p>
        </div>
        <div id="admin-content"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" class="nav-item active" data-view="envelopes">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M4 7l8 6 8-6"/></svg></span>
        <span>Letters</span>
      </button>
      <button type="button" class="nav-item" data-view="memories">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.4A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.6c0 5-7 9.4-7 9.4z"/></svg></span>
        <span>Memories</span>
      </button>
      <button type="button" class="nav-item" data-view="vouchers">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M12 7v2M12 15v2"/></svg></span>
        <span>Vouchers</span>
      </button>
      <button type="button" class="nav-item" data-view="distance">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <span>Send a message</span>
      </button>
      <button type="button" class="nav-item" data-view="admin" id="nav-admin" hidden>
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3l1.6 2.2 2.7-.4.6 2.7 2.4 1.3-1 2.5 1 2.5-2.4 1.3-.6 2.7-2.7-.4L12 21l-1.6-2.2-2.7.4-.6-2.7-2.4-1.3 1-2.5-1-2.5 2.4-1.3.6-2.7 2.7.4z"/></svg></span>
        <span>Studio</span>
      </button>
    </nav>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="noscript">This little place needs JavaScript to open.</p>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
